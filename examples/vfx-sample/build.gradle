plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.4.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.267'
    runs { client { client() } }
    mods { vfxsample { sourceSet sourceSets.main } }
}
// Os dois JARs vêm da raiz: rode antes `./gradlew dist` lá, que gera o JAR do motor em dist/ e baixa a RimuLib
// (conferida por SHA-256) para libs/. Nenhum dos dois é versionado.
def engineJar = file('../../dist/calamidade_awakening-0.8.0.jar')
def rimuLibJar = file('../../libs/rimulib-1.3.0-neoforge.jar')
tasks.named('compileJava') {
    doFirst {
        [engineJar, rimuLibJar].each { jar ->
            if (!jar.exists()) throw new GradleException("Falta ${jar}. Rode `./gradlew dist` na raiz do repositório.")
        }
    }
}
dependencies {
    implementation files(engineJar)
    implementation files(rimuLibJar)
}
