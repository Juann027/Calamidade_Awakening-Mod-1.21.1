plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.4.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.267'
    runs { client { client() } }
    mods { vfxsample { sourceSet sourceSets.main } }
}
dependencies {
    implementation files('../../dist/calamidade_awakening-0.7.0.jar')
    implementation files('../../libs/rimulib-1.3.0-neoforge.jar')
}
