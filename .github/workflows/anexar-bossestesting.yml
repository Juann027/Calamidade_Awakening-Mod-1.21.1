# Anexa o JAR do addon BossesTesting a um release JÁ publicado do Calamidade, sem recriar o release, sem mudar a
# tag e sem tocar nos JARs existentes: compila o addon, faz upload (substitui só o próprio JAR) e recalcula o
# SHA256SUMS.txt com os JARs que já estão no release mais o novo.
name: Anexar BossesTesting ao release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag do release (ex.: v0.14.0)"
        required: true
        default: "v0.14.0"
  push:
    branches: [claude/bold-knuth-9n4rgm]
    paths: [".github/workflows/anexar-bossestesting.yml", "examples/bossestesting/**"]

permissions:
  contents: write

jobs:
  anexar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || 'v0.14.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Baixar a RimuLib do CurseForge (SHA-256)
        run: |
          url=$(grep '^rimulib.url=' gradle.properties | cut -d= -f2-)
          sha=$(grep '^rimulib.sha256=' gradle.properties | cut -d= -f2-)
          mkdir -p libs
          curl -fsSL --retry 4 --retry-delay 5 -o libs/rimulib-1.3.0-neoforge.jar "$url"
          echo "$sha  libs/rimulib-1.3.0-neoforge.jar" | sha256sum -c -
      - name: Instalar o glslangValidator
        run: sudo apt-get update -q && sudo apt-get install -y -q glslang-tools
      - name: JAR do motor (para compilar o addon)
        run: ./gradlew dist
      - name: Build do addon (checkBoss + checkShaders)
        run: ./gradlew -p examples/bossestesting build
      - name: Anexar ao release e recalcular SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=examples/bossestesting/build/libs/bossestesting-0.1.0.jar
          gh release upload "$TAG" "$jar" --clobber
          mkdir -p out
          gh release download "$TAG" -D out -p '*.jar'
          (cd out && sha256sum *.jar | tee SHA256SUMS.txt)
          gh release upload "$TAG" out/SHA256SUMS.txt --clobber
          echo "Anexos:"; gh release view "$TAG" --json assets -q '.assets[].name'
