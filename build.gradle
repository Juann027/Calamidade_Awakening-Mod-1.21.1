plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.calamidade_awakening'
version = '0.7.0'
base { archivesName = 'calamidade_awakening' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.267'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        calamidade_awakening { sourceSet sourceSets.main }
    }
}

// RimuLib: baixada do CurseForge e conferida por SHA-256 (gradle.properties). Nunca é versionada nem embutida
// no JAR do Calamidade; quem joga instala a RimuLib separadamente. Veja libs/README.md.
def rimuLibJar = layout.projectDirectory.file('libs/rimulib-1.3.0-neoforge.jar').asFile
def rimuLibUrl = providers.gradleProperty('rimulib.url').get()
def rimuLibSha256 = providers.gradleProperty('rimulib.sha256').get()
def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        for (int read = input.read(buffer); read > 0; read = input.read(buffer)) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}
def rimuLib = tasks.register('rimulib') {
    group = 'build setup'
    description = 'Baixa a RimuLib 1.3.0 do CurseForge para libs/ (se faltar) e confere o SHA-256.'
    outputs.file(rimuLibJar)
    doLast {
        if (!rimuLibJar.exists()) {
            logger.lifecycle("Baixando a RimuLib de ${rimuLibUrl}")
            rimuLibJar.parentFile.mkdirs()
            def partial = new File(rimuLibJar.parentFile, rimuLibJar.name + '.part')
            new URI(rimuLibUrl).toURL().withInputStream { input -> partial.withOutputStream { it << input } }
            def downloaded = sha256Of(partial)
            if (downloaded != rimuLibSha256) {
                partial.delete()
                throw new GradleException("SHA-256 da RimuLib baixada não confere: ${downloaded} (esperado ${rimuLibSha256})")
            }
            if (!partial.renameTo(rimuLibJar)) throw new GradleException("Não foi possível gravar ${rimuLibJar}")
        }
        def actual = sha256Of(rimuLibJar)
        if (actual != rimuLibSha256)
            throw new GradleException("SHA-256 de ${rimuLibJar} não confere: ${actual} (esperado ${rimuLibSha256}). Apague o arquivo e rode de novo.")
    }
}
dependencies {
    implementation files(rimuLibJar).builtBy(rimuLib)
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Smoke checks exercise Minecraft's actual vertex API on the development classpath.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.register('checkBudget', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.calamidade_awakening.FrameBudgetCheck'
}
tasks.named('check') { dependsOn 'checkBudget' }
// FrameBudgetCheck is an executable smoke test, not a JUnit suite.
tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('checkFrustum', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.calamidade_awakening.client.FrustumCheck'
}
tasks.named('check') { dependsOn 'checkFrustum' }

// Copia o JAR compilado para dist/, de onde o exemplo vfx-sample e o pacote de entrega o consomem.
tasks.register('dist', Copy) {
    dependsOn tasks.named('build')
    from tasks.named('jar')
    into layout.projectDirectory.dir('dist')
}
