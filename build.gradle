plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.calamidade_awakening'
version = '0.15.0'
base { archivesName = 'calamidade_awakening' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForge do build. O manifesto aceita [21.1,21.2); -Pneoforge.version=21.1.265 compila e testa contra outra
// versão da linha 21.1 (a 0.10.0 foi conferida com a 21.1.265, a do RespectCraft). Os releases saem da 21.1.267.
def neoForgeVersion = providers.gradleProperty('neoforge.version').getOrElse('21.1.267')

// 0.11.1: teste automatizado em jogo. src/testeJogo é um mod à parte (calamidade_teste) que nunca entra no JAR do
// motor; só as runs testeServidor e testeReinicio o carregam. Veja a task testeJogo, abaixo.
sourceSets {
    testeJogo {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def testeJogoDir = layout.projectDirectory.dir('run/teste-jogo').asFile
def testeClienteDir = layout.projectDirectory.dir('run/teste-cliente').asFile
def testeMedicaoDir = layout.projectDirectory.dir('run/teste-medicao').asFile
neoForge {
    version = neoForgeVersion
    mods {
        calamidade_awakening { sourceSet sourceSets.main }
        calamidade_teste { sourceSet sourceSets.testeJogo }
    }
    runs {
        client { client(); loadedMods = [mods.calamidade_awakening] }
        server { server(); programArgument '--nogui'; loadedMods = [mods.calamidade_awakening] }
        // Servidor dedicado sem tela, mundo plano próprio: cenários (fase 1) e a mesma pasta reaberta (fase 2).
        testeServidor {
            server(); programArgument '--nogui'
            sourceSet = sourceSets.testeJogo
            gameDirectory = testeJogoDir
            systemProperty 'calamidade.teste', 'cenarios'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        testeReinicio {
            server(); programArgument '--nogui'
            sourceSet = sourceSets.testeJogo
            gameDirectory = testeJogoDir
            systemProperty 'calamidade.teste', 'reinicio'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // Cliente (precisa de tela: xvfb-run), no mundo deixado pelo testeJogo, copiado para saves/teste.
        testeCliente {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = testeClienteDir
            systemProperty 'calamidade.teste', 'cliente'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.11.2: Atlas Estelar no mundo (placas, clique sem atacar atrás, abas, fechamento, capturas).
        testeAtlas {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-atlas').asFile
            systemProperty 'calamidade.teste', 'atlas'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.12.0: céu, eventos globais e céu por dimensão no cliente, com o vfx-sample em mods/.
        testeCeu {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-ceu').asFile
            systemProperty 'calamidade.teste', 'ceu'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.14: teste do Backdrop em jogo (fase 2: fundos reais do motor), com o vfx-sample em mods/.
        testeBackdrop {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-backdrop').asFile
            systemProperty 'calamidade.teste', 'backdrop'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.14 (fase 3): estrelas, constelações e nebulosas em jogo, com o vfx-sample em mods/.
        testeEstrelas {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-estrelas').asFile
            systemProperty 'calamidade.teste', 'estrelas'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.14 (fase 4): imagens, flipbooks e impostors em jogo (recursos do mod de teste; sem o vfx-sample).
        testeImagens {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-imagens').asFile
            systemProperty 'calamidade.teste', 'imagens'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.13.0: chefes no cliente (anchors, barra, acessibilidade, Sentinela do vfx-sample), uma só inicialização.
        testeChefe {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-chefe').asFile
            systemProperty 'calamidade.teste', 'chefe'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.15.0: laboratório de luz em jogo e benchmark comparável com a 0.14.0, com o vfx-sample.
        testeLuz {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-luz').asFile
            systemProperty 'calamidade.teste', 'luz'
            // Benchmark rigoroso (GPU real): -Pluz.modo=bench [-Pluz.reps=5 -Pluz.aquecer=8 -Pluz.trocar=3 -Pluz.amostra=15
            // -Pluz.largura=1920 -Pluz.altura=1080]. Sem -Pluz.modo: o roteiro funcional + capturas + medida curta.
            systemProperty 'calamidade.luz.modo', providers.gradleProperty('luz.modo').getOrElse('completo')
            // Fase 3: -Pluz.modo=fase3 (verificação funcional do orçamento adaptativo) e -Pluz.perfis=LOW,BALANCED,HIGH,ULTRA.
            ['reps', 'aquecer', 'trocar', 'amostra', 'cenarios', 'perfis'].each { k ->
                systemProperty "calamidade.luz.${k}", providers.gradleProperty("luz.${k}").getOrElse('')
            }
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument providers.gradleProperty('luz.largura').getOrElse('1280')
            programArgument '--height'; programArgument providers.gradleProperty('luz.altura').getOrElse('720')
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.15.0: regressão de efeitos órfãos (eclipse do Sentinela, reabrir o mundo, kill, respawn), com o vfx-sample.
        testeOrfaos {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = layout.projectDirectory.dir('run/teste-orfaos').asFile
            systemProperty 'calamidade.teste', 'orfaos'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
        // 0.11.2: medição de custo por efeito e por passe (CostProbe), cliente com o vfx-sample em mods/.
        testeMedicao {
            client()
            sourceSet = sourceSets.testeJogo
            gameDirectory = testeMedicaoDir
            systemProperty 'calamidade.teste', 'medicao'
            programArgument '--quickPlaySingleplayer'; programArgument 'teste'
            programArgument '--width'; programArgument '1280'; programArgument '--height'; programArgument '720'
            loadedMods = [mods.calamidade_awakening, mods.calamidade_teste]
        }
    }
}

// RimuLib: baixada do CurseForge e conferida por SHA-256 (gradle.properties). Nunca é versionada nem embutida
// no JAR do Calamidade; quem joga instala a RimuLib separadamente. Veja libs/README.md.
def rimuLibJar = layout.projectDirectory.file('libs/rimulib-1.3.0-neoforge.jar').asFile
def rimuLibUrl = providers.gradleProperty('rimulib.url').get()
def rimuLibSha256 = providers.gradleProperty('rimulib.sha256').get()
def sha256Of = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        for (int read = input.read(buffer); read > 0; read = input.read(buffer)) digest.update(buffer, 0, read)
    }
    digest.digest().encodeHex().toString()
}
def rimuLib = tasks.register('rimulib') {
    group = 'build setup'
    description = 'Baixa a RimuLib 1.3.0 do CurseForge para libs/ (se faltar) e confere o SHA-256.'
    outputs.file(rimuLibJar)
    doLast {
        if (!rimuLibJar.exists()) {
            logger.lifecycle("Baixando a RimuLib de ${rimuLibUrl}")
            rimuLibJar.parentFile.mkdirs()
            def partial = new File(rimuLibJar.parentFile, rimuLibJar.name + '.part')
            new URI(rimuLibUrl).toURL().withInputStream { input -> partial.withOutputStream { it << input } }
            def downloaded = sha256Of(partial)
            if (downloaded != rimuLibSha256) {
                partial.delete()
                throw new GradleException("SHA-256 da RimuLib baixada não confere: ${downloaded} (esperado ${rimuLibSha256})")
            }
            if (!partial.renameTo(rimuLibJar)) throw new GradleException("Não foi possível gravar ${rimuLibJar}")
        }
        def actual = sha256Of(rimuLibJar)
        if (actual != rimuLibSha256)
            throw new GradleException("SHA-256 de ${rimuLibJar} não confere: ${actual} (esperado ${rimuLibSha256}). Apague o arquivo e rode de novo.")
    }
}
dependencies {
    implementation files(rimuLibJar).builtBy(rimuLib)
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Smoke checks exercise Minecraft's actual vertex API on the development classpath.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

tasks.register('checkBudget', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.calamidade_awakening.FrameBudgetCheck'
}
tasks.named('check') { dependsOn 'checkBudget' }
// FrameBudgetCheck is an executable smoke test, not a JUnit suite.
tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('checkFrustum', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.calamidade_awakening.client.FrustumCheck'
}
tasks.named('check') { dependsOn 'checkFrustum' }

// 0.8.0: compila cada shader fx do motor e do vfx-sample com o glslangValidator, montado como a RimuLib 1.3.0 monta
// (ShaderProgram.readSource, conferido com javap -c): common.glsl da RimuLib, "#line 1 1" e cada linha
// '#include "arquivo"' trocada pelo arquivo de assets/<namespace>/shaders/fx/ (ou da RimuLib), sem recursão.
// Sem o glslangValidator no PATH a task só avisa; com CI=true ou -PrequireShaders ela falha.
tasks.register('checkShaders') {
    group = 'verification'
    description = 'Compila os shaders fx do motor e do vfx-sample com o glslangValidator (common.glsl + #include).'
    dependsOn rimuLib
    def roots = [layout.projectDirectory.dir('src/main/resources/assets').asFile,
                 layout.projectDirectory.dir('examples/vfx-sample/src/main/resources/assets').asFile]
    def out = layout.buildDirectory.dir('shader-check').get().asFile
    def required = providers.environmentVariable('CI').map { it == 'true' }.orElse(false).get() || project.hasProperty('requireShaders')
    def processes = providers
    roots.each { inputs.dir(it) }
    inputs.file(rimuLibJar)
    outputs.dir(out)
    doLast {
        def validator = ['glslangValidator', 'glslangValidator.exe'].collect { name ->
            System.getenv('PATH').split(File.pathSeparator).collect { new File(it, name) }.find { it.canExecute() }
        }.find { it != null }
        if (validator == null) {
            if (required) throw new GradleException('checkShaders: glslangValidator não encontrado no PATH')
            logger.warn('checkShaders: glslangValidator não encontrado; shaders não verificados (instale glslang-tools).')
            return
        }
        def zip = new java.util.zip.ZipFile(rimuLibJar)
        def rimu = { String path -> def e = zip.getEntry('assets/rimulib/shaders/fx/' + path); e == null ? null : zip.getInputStream(e).getText('UTF-8') }
        def common = rimu('common.glsl')
        out.mkdirs()
        def checked = 0
        roots.each { root ->
            root.eachDir { ns ->
                def fx = new File(ns, 'shaders/fx')
                if (!fx.isDirectory()) return
                fx.listFiles().findAll { it.name.endsWith('.fsh') }.sort().each { shader ->
                    def lines = shader.getText('UTF-8').split('\n', -1)
                    def body = new StringBuilder()
                    lines.eachWithIndex { line, i ->
                        def t = line.trim()
                        if (t.startsWith('#include "') && t.endsWith('"') && t.length() > 11) {
                            def name = t.substring(10, t.length() - 1)
                            def local = new File(fx, name)
                            def text = local.isFile() ? local.getText('UTF-8') : rimu(name)
                            if (text == null) throw new GradleException("${shader}: #include \"${name}\" não encontrado em ${ns.name} nem na RimuLib")
                            body.append(text).append('\n#line ').append(i + 2).append(' 1\n')
                        } else body.append(line).append('\n')
                    }
                    def target = new File(out, "${ns.name}_${shader.name}.frag")
                    target.setText(common + '\n#line 1 1\n' + body, 'UTF-8')
                    def result = processes.exec {
                        commandLine validator.absolutePath, '-S', 'frag', target.absolutePath
                        ignoreExitValue = true
                    }
                    def text = result.standardOutput.asText.get() + result.standardError.asText.get()
                    if (result.result.get().exitValue != 0)
                        throw new GradleException("checkShaders: ${ns.name}:${shader.name} não compila:\n${text}")
                    checked++
                }
            }
        }
        zip.close()
        // 0.14.0 (fase 3): shaders de núcleo (shaders/core, GLSL 150 do jogo), com cada "#moj_import <ns:arquivo>"
        // trocado por assets/<ns>/shaders/include/<arquivo>, como o NeoForge resolve (ClientHooks.getShaderImportLocation).
        roots.each { root ->
            root.eachDir { ns ->
                def core = new File(ns, 'shaders/core')
                if (!core.isDirectory()) return
                core.listFiles().findAll { it.name.endsWith('.vsh') || it.name.endsWith('.fsh') }.sort().each { shader ->
                    def body = new StringBuilder()
                    shader.getText('UTF-8').split('\n', -1).each { line ->
                        def m = line.trim() =~ /^#moj_import <([a-z0-9_.-]+):([a-z0-9_.\/-]+)>$/
                        if (m.matches()) {
                            def include = new File(root, "${m.group(1)}/shaders/include/${m.group(2)}")
                            if (!include.isFile()) throw new GradleException("${shader}: #moj_import ${m.group(1)}:${m.group(2)} não encontrado")
                            body.append(include.getText('UTF-8')).append('\n')
                        } else body.append(line).append('\n')
                    }
                    def stage = shader.name.endsWith('.vsh') ? 'vert' : 'frag'
                    def target = new File(out, "${ns.name}_core_${shader.name}.${stage}")
                    target.setText(body.toString(), 'UTF-8')
                    def result = processes.exec {
                        commandLine validator.absolutePath, '-S', stage, target.absolutePath
                        ignoreExitValue = true
                    }
                    def text = result.standardOutput.asText.get() + result.standardError.asText.get()
                    if (result.result.get().exitValue != 0)
                        throw new GradleException("checkShaders: ${ns.name}:core/${shader.name} não compila:\n${text}")
                    checked++
                }
            }
        }
        // Cópias da biblioteca em outros namespaces (addons não alcançam o namespace do motor) devem ser idênticas.
        def library = new File(roots[0], 'calamidade_awakening/shaders/fx/calamidade_fx.glsl')
        roots.each { root ->
            root.eachDir { ns ->
                def copy = new File(ns, 'shaders/fx/calamidade_fx.glsl')
                if (copy.isFile() && copy != library && copy.getText('UTF-8') != library.getText('UTF-8'))
                    throw new GradleException("checkShaders: ${copy} difere de ${library}; copie a versão do motor")
            }
        }
        logger.lifecycle("checkShaders: ${checked} shaders compilados com ${validator.name}")
    }
}
tasks.named('check') { dependsOn 'checkShaders' }

// 0.8.0: docs/ai/API-REFERENCIA.md é gerado de javap -public no JAR + Javadoc (scripts/ApiReferencia.java, Java de
// arquivo único rodado pelo java do toolchain). apiDocs regenera; checkApiDocs falha se o arquivo estiver
// desatualizado ou se algum membro público da api.v1 estiver sem Javadoc.
def apiLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
['apiDocs': false, 'checkApiDocs': true].each { taskName, checkOnly ->
    tasks.register(taskName, Exec) {
        group = checkOnly ? 'verification' : 'documentation'
        description = checkOnly ? 'Falha se docs/ai/API-REFERENCIA.md não corresponde à api.v1 compilada.'
            : 'Regenera docs/ai/API-REFERENCIA.md a partir do JAR (javap) e do Javadoc.'
        def jarFile = tasks.named('jar').flatMap { it.archiveFile }
        dependsOn tasks.named('jar')
        inputs.file(jarFile)
        inputs.dir('src/main/java/dev/calamidade_awakening/api/v1')
        inputs.file('scripts/ApiReferencia.java')
        def reference = layout.projectDirectory.file('docs/ai/API-REFERENCIA.md').asFile
        if (checkOnly) { inputs.file(reference); outputs.upToDateWhen { false } } else outputs.file(reference)
        executable = apiLauncher.get().executablePath.asFile.absolutePath
        workingDir = layout.projectDirectory.asFile
        def arguments = ['-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8', 'scripts/ApiReferencia.java', '--jar', jarFile.get().asFile.absolutePath,
                         '--src', 'src/main/java', '--out', 'docs/ai/API-REFERENCIA.md']
        if (checkOnly) arguments << '--check'
        args arguments
    }
}
tasks.named('check') { dependsOn 'checkApiDocs' }

// 0.14 (fase 1): compatibilidade binária da api.v1 contra a base do último release (scripts/api-base/, gerada do JAR
// publicado, byte a byte igual ao do release). checkApiCompat (parte do build) roda o autoteste do verificador e falha
// se faltar classe ou membro, se um cabeçalho mudar, se um tipo extensível ganhar método abstrato ou se um enum perder
// ou reordenar constantes. Adições são permitidas (AGENTS.md, regra 1).
tasks.register('checkApiCompat') {
    group = 'verification'
    description = 'Falha se a api.v1 compilada quebra a compatibilidade binária com a base do último release.'
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    dependsOn tasks.named('jar')
    inputs.file(jarFile)
    inputs.file('scripts/ApiCompat.java')
    inputs.dir('scripts/api-base')
    outputs.upToDateWhen { false }
    def launcher = apiLauncher
    def root = layout.projectDirectory.asFile
    doLast {
        def java = launcher.get().executablePath.asFile.absolutePath
        def bases = new File(root, 'scripts/api-base').listFiles().findAll { it.name.endsWith('.txt') }.sort { it.name }
        def runs = [[]] + bases.collect { ['--base', it.absolutePath] }
        runs.each { extra ->
            def process = ([java, '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8', 'scripts/ApiCompat.java',
                            '--jar', jarFile.get().asFile.absolutePath] + extra).execute(null, root)
            def out = new StringBuilder(), err = new StringBuilder()
            process.consumeProcessOutput(out, err)
            int code = process.waitFor()
            if (out) logger.lifecycle(out.toString().trim())
            if (code != 0) throw new GradleException("checkApiCompat falhou:\n" + err.toString().trim())
        }
    }
}
tasks.named('check') { dependsOn 'checkApiCompat' }

// 0.14 (fase 1): referência visual da Sky API da 0.12.0. Roda os passes reais sky e atmosphere pela prévia (Node e
// Playwright, ~2 min) e compara 15 cenas com src/test/resources/referencia-ceu/. Fora do check (precisa de Node);
// rode em toda etapa que tocar em céu, atmosfera ou shaders: ./gradlew checkCeuReferencia.
// 0.14 (fase 2): mais 11 cenas com fundos de céu e, depois, a prova da composição dos fundos com a Atmosphere, o
// apagamento do sol e o eclipse por sondas de pixel (node scripts/fundo_composicao.cjs, checkFundoComposicao).
tasks.register('checkFundoComposicao', Exec) {
    group = 'verification'
    description = 'Prova por sondas de pixel a composição dos fundos de céu com Atmosphere, sol do jogo e eclipse (node scripts/fundo_composicao.cjs).'
    dependsOn tasks.named('jar')
    workingDir = layout.projectDirectory.asFile
    commandLine 'node', 'scripts/fundo_composicao.cjs'
}

// 0.14 (fase 3): objetos do céu (estrelas, constelações, nebulosas) com os shaders de núcleo reais em WebGL2 e os
// passes reais: composição NORMAL, LUMINOUS e COVER, Atmosphere, eclipse, sol do jogo, ordem e lente, por sondas de
// pixel com controles negativos (node scripts/objetos_composicao.cjs, checkObjetosComposicao).
tasks.register('checkObjetosComposicao', Exec) {
    group = 'verification'
    description = 'Prova por sondas de pixel a composição das estrelas e nebulosas com o fundo, a Atmosphere, o eclipse, o sol do jogo e a lente (node scripts/objetos_composicao.cjs).'
    dependsOn tasks.named('jar')
    mustRunAfter 'checkFundoComposicao'
    workingDir = layout.projectDirectory.asFile
    commandLine 'node', 'scripts/objetos_composicao.cjs'
}

tasks.register('checkCeuReferencia', Exec) {
    group = 'verification'
    description = 'Compara a aparência dos passes sky e atmosphere com as referências (15 cenas da 0.12.0, 11 com fundos e as de objetos do céu; node scripts/referencia_ceu.cjs).'
    dependsOn tasks.named('jar')
    finalizedBy tasks.named('checkFundoComposicao'), tasks.named('checkObjetosComposicao')
    workingDir = layout.projectDirectory.asFile
    commandLine 'node', 'scripts/referencia_ceu.cjs'
}

// 0.8.0: as receitas de docs/ai/receitas/ trazem o código dos efeitos reais do vfx-sample. Cada bloco de código
// precedido por "<!-- arquivo: caminho -->" precisa ser idêntico ao arquivo. syncRecipes copia os arquivos para os
// blocos; checkRecipes (parte do build) falha se algum bloco divergir. 0.10.0: o modelo de dependência
// (docs/ai/usar-como-dependencia.md) é conferido do mesmo jeito contra examples/consumidor.
def recipeBlocks = ~/<!-- arquivo: (\S+) -->\n```(\w+)\n((?:(?!```)[\s\S])*)```/
['syncRecipes': false, 'checkRecipes': true].each { taskName, checkOnly ->
    tasks.register(taskName) {
        group = checkOnly ? 'verification' : 'documentation'
        description = checkOnly ? 'Falha se o código das receitas em docs/ai/receitas/ diverge dos arquivos do vfx-sample.'
            : 'Copia o código do vfx-sample para os blocos das receitas em docs/ai/receitas/.'
        def root = layout.projectDirectory.asFile
        def docs = layout.projectDirectory.dir('docs/ai/receitas').asFile
        def dependency = layout.projectDirectory.file('docs/ai/usar-como-dependencia.md').asFile
        inputs.dir(docs)
        inputs.file(dependency)
        inputs.dir(layout.projectDirectory.dir('examples/vfx-sample/src'))
        inputs.files(layout.projectDirectory.files('examples/consumidor/build.gradle', 'examples/consumidor/settings.gradle'))
        inputs.dir(layout.projectDirectory.dir('examples/consumidor/src'))
        if (checkOnly) outputs.upToDateWhen { false }
        doLast {
            def stale = []
            (docs.listFiles().findAll { it.name.endsWith('.md') }.sort() + [dependency]).each { doc ->
                def text = doc.getText('UTF-8')
                def updated = text.replaceAll(recipeBlocks) { all, path, lang, body ->
                    def source = new File(root, path)
                    if (!source.isFile()) throw new GradleException("${doc.name}: arquivo inexistente ${path}")
                    def code = source.getText('UTF-8').replaceAll(/\n+$/, '')
                    if (code + '\n' != body) stale << "${doc.name} -> ${path}"
                    "<!-- arquivo: ${path} -->\n```${lang}\n${code}\n```"
                }
                if (!checkOnly && updated != text) doc.setText(updated, 'UTF-8')
            }
            if (checkOnly && !stale.isEmpty())
                throw new GradleException("Receitas desatualizadas (rode ./gradlew syncRecipes):\n  " + stale.join('\n  '))
            if (!checkOnly) logger.lifecycle("syncRecipes: ${stale.size()} blocos atualizados")
        }
    }
}
tasks.named('check') { dependsOn 'checkRecipes' }

// 0.8.0: a versão do manifesto do motor precisa ser a do build, e o exemplo precisa aceitá-la (a 0.8.0 saiu do
// Gradle com o manifesto ainda em 0.7.0, e o vfx-sample 1.5.0 era recusado no jogo; o teste em jogo achou isso).
tasks.register('checkModVersion') {
    group = 'verification'
    description = 'Confere a versão do neoforge.mods.toml do motor e o intervalo exigido pelo vfx-sample.'
    def manifest = layout.projectDirectory.file('src/main/resources/META-INF/neoforge.mods.toml').asFile
    def sampleManifest = layout.projectDirectory.file('examples/vfx-sample/src/main/resources/META-INF/neoforge.mods.toml').asFile
    def sampleBuild = layout.projectDirectory.file('examples/vfx-sample/build.gradle').asFile
    def engineVersion = project.version.toString()
    inputs.files(manifest, sampleManifest, sampleBuild)
    outputs.upToDateWhen { false }
    doLast {
        def declared = (manifest.getText('UTF-8') =~ /(?m)^version="([^"]+)"/)[0][1]
        if (declared != engineVersion)
            throw new GradleException("neoforge.mods.toml declara ${declared}, mas o build é ${engineVersion}")
        def sample = sampleManifest.getText('UTF-8')
        def sampleVersion = (sample =~ /(?m)^version="([^"]+)"/)[0][1]
        def sampleGradle = (sampleBuild.getText('UTF-8') =~ /(?m)^version = '([^']+)'/)[0][1]
        if (sampleVersion != sampleGradle)
            throw new GradleException("vfx-sample: manifesto ${sampleVersion} e build.gradle ${sampleGradle} diferem")
        def range = (sample =~ /(?s)modId="calamidade_awakening".*?versionRange="\[([^,]+),([^)]+)\)"/)[0]
        def parse = { String v -> v.split('\\.').collect { it as int } }
        def cmp = { List a, List b -> [a, b].transpose().collect { x, y -> x <=> y }.find { it != 0 } ?: (a.size() <=> b.size()) }
        def v = parse(engineVersion)
        if (cmp(v, parse(range[1])) < 0 || cmp(v, parse(range[2])) >= 0)
            throw new GradleException("vfx-sample exige calamidade_awakening [${range[1]},${range[2]}), mas o motor é ${engineVersion}")
        if (!sampleBuild.getText('UTF-8').contains("calamidade_awakening-${engineVersion}.jar"))
            throw new GradleException("examples/vfx-sample/build.gradle não compila contra calamidade_awakening-${engineVersion}.jar")
        logger.lifecycle("checkModVersion: motor ${engineVersion}, vfx-sample ${sampleVersion} exige [${range[1]},${range[2]})")
    }
}
tasks.named('check') { dependsOn 'checkModVersion' }

